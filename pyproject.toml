[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nimbus-mcp"
version = "0.14.19"
description = "MCP server bridging AI agents to Nimbus BCI pipelines (device-flow login, desktop auto-discovery, or API key)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9",
    # Imported directly (mcp.types, mcp.server.auth, mcp.shared.auth); tested on 2.2.0 and 2.3.0.
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nimbusbci/nimbus-mcp"
Repository = "https://github.com/nimbusbci/nimbus-mcp"
Changelog = "https://github.com/nimbusbci/nimbus-mcp/releases"

[project.scripts]
nimbus-mcp = "nimbus_mcp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyyaml>=6",  # tests/integration/test_template_drift.py reads backend YAMLs
]
# Hosted-gateway error reporting (`nimbus-mcp serve` + SENTRY_DSN). Optional
# on purpose: stdio/PyPI installs never initialize telemetry and stay slim.
sentry = [
    "sentry-sdk>=2.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus_mcp"]

[tool.hatch.build.targets.sdist]
# Local-machine artifacts must never ride the public sdist (it also feeds the
# nimbusbci/nimbus-mcp storefront sync); hatchling's defaults miss dot-dirs
# like .video_agent that are only gitignored.
exclude = [".video_agent", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
