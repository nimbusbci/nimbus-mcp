[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimbus-mcp"
version = "0.5.1"
description = "MCP server bridging AI agents to Nimbus BCI pipelines (device-flow login, desktop auto-discovery, or API key)"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9",
    "httpx>=0.27",
    "pydantic>=2.7",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nimbusbci/nimbus-mcp"
Repository = "https://github.com/nimbusbci/nimbus-mcp"
Changelog = "https://github.com/nimbusbci/nimbus-mcp/releases"

[project.scripts]
nimbus-mcp = "nimbus_mcp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
