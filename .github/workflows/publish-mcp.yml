name: Publish to MCP Registry

# Official MCP Registry (registry.modelcontextprotocol.io) publishing via
# GitHub OIDC — the io.github.nimbusbci/ namespace is proven by this repo.
# PyPI publishing stays in the NimbusStudio monorepo release workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: latest tag)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # git describe needs tags for the dispatch fallback

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version with tag
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "publishing $VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Validate
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
