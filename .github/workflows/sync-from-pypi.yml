name: Sync from PyPI release

# The NimbusStudio monorepo owns releases (PyPI publish). This job watches
# PyPI for new nimbus-mcp versions and mirrors them here, then tags — the tag
# triggers publish-mcp.yml (official MCP Registry). The sdist carries
# src/tests/pyproject/README/LICENSE/server.json/smithery.yaml/glama.json,
# so no cross-repo tokens are needed. Smithery has no auto-sync from PyPI,
# so its release publish rides this same job (see final step).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_smithery:
        description: "Re-publish to Smithery even without a new PyPI version"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write  # MCP Registry OIDC publish (inline)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check PyPI for a newer version
        id: check
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/nimbus-mcp/json | jq -r .info.version)
          if git rev-parse -q --verify "refs/tags/v$LATEST" >/dev/null; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "PyPI latest v$LATEST already mirrored"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "New version v$LATEST to mirror"
          fi

      - name: Download sdist
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          V=${{ steps.check.outputs.version }}
          mkdir -p /tmp/sdist
          curl -sL "https://pypi.org/pypi/nimbus-mcp/$V/json" \
            | jq -r '.urls[] | select(.packagetype == "sdist") | .url' \
            | xargs curl -sL -o /tmp/sdist/pkg.tar.gz
          tar -xzf /tmp/sdist/pkg.tar.gz -C /tmp/sdist --strip-components=1

      - name: Overlay release files
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            /tmp/sdist/ ./
          # keep registry workflows + gitignore from this repo

      - name: Commit and tag
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          V=${{ steps.check.outputs.version }}
          git config user.name "nimbus-release-bot"
          git config user.email "hello@nimbusbci.com"
          git add -A
          git commit -m "release: v$V (synced from PyPI)" || { echo "no changes to commit"; exit 0; }
          git tag "v$V"
          git push origin main --tags

      # A GITHUB_TOKEN tag push does NOT trigger publish-mcp.yml (GitHub never
      # fires workflows from GITHUB_TOKEN push events), so the registry
      # publish runs inline here, in the same job that owns the OIDC identity.
      - name: Install mcp-publisher
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version with tag
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          V=${{ steps.check.outputs.version }}
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Validate
        if: steps.check.outputs.up_to_date == 'false'
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        if: steps.check.outputs.up_to_date == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.check.outputs.up_to_date == 'false'
        run: ./mcp-publisher publish

      # Smithery does NOT auto-sync from PyPI: its listing (tool list +
      # quality-panel scan) only moves when a release is published with the
      # namespace API key. Ride the same version-change gate so every PyPI
      # release refreshes Smithery too; dispatch with force_smithery to
      # refresh without a release. If this step fails, the registry publish
      # above has already landed — re-run or dispatch force_smithery once
      # Smithery is reachable again.
      - name: Publish release to Smithery
        if: steps.check.outputs.up_to_date == 'false' || inputs.force_smithery == true
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          test -n "$SMITHERY_API_KEY" || { echo "::error::SMITHERY_API_KEY secret not set"; exit 1; }
          npx -y @smithery/cli mcp publish "https://nimbus-mcp.fly.dev/mcp" -n @nimbusbci/nimbus-mcp
